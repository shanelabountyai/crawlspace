name: CI

on:
  push:
    branches: [main, kickoff, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # postinstall: prisma generate
      - name: Install Chromium for the renderer and e2e tests
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the Prisma schema
        run: bash scripts/check-migrations.sh
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: e2e (Playwright, fixture sites on a local server)
        run: npm run e2e
      # Opt-in base path (D-103): a second build with CRAWLSPACE_BASE_PATH set and the focused base-path spec. Runs after
      # the default e2e, which used the build above without it.
      - name: Build with a base path (/agent-check)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CRAWLSPACE_BASE_PATH: /agent-check
      - name: e2e under the base path (home → scan → report → PDF gate, no-JS posts, operator, health, headers)
        run: npm run e2e:base-path
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Gate for the Docker image (Dockerfile, render.yaml; D-71). Builds the image, starts the container the way Render
  # does (PORT from the platform, DATABASE_FILE on a mounted volume), and fails unless the health route and the home
  # page both answer 200. Deploys nothing and needs no secrets.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t crawlspace:ci .
      - name: Start the container, wait for /api/health, request the home page
        run: bash scripts/docker-smoke.sh crawlspace:ci
