name: CI

on:
  push:
    branches: [main, kickoff, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # postinstall: prisma generate
      - name: Install Chromium for the renderer and e2e tests
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the Prisma schema
        run: bash scripts/check-migrations.sh
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: e2e (Playwright, fixture sites on a local server)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
